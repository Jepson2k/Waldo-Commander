name: tests

on:
  # Run once per change: pull_request covers PR branches; push covers main
  # (and any direct, PR-less pushes to it). Avoids the duplicate push +
  # pull_request runs on every PR commit. workflow_dispatch lets a branch
  # be exercised before any PR exists.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Constrains PEP 517 build environments too (see the file for why).
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pip-build-constraints.txt

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          pip install -e ".[dev]"
          # Override the pinned waldoctl/parol6 with the matching feature branch
          # if one exists, AFTER ".[dev]" so its pinned tags don't clobber it.
          # Skipped on main: pushes to main must test the pyproject-pinned tags
          # (every sibling repo has a `main`, so the match would always fire and
          # main CI would never exercise the released pins).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/Jepson2k/par6.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "par6 @ git+https://github.com/Jepson2k/par6.git@${BRANCH}#subdirectory=python"
            fi
          fi
          mkdir -p PAROL6-python-API
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          pip install ".[dev]"
          # Override the pinned waldoctl/parol6 with the matching feature branch
          # if one exists, AFTER ".[dev]" so its pinned tags don't clobber it.
          # Skipped on main: pushes to main must test the pyproject-pinned tags
          # (every sibling repo has a `main`, so the match would always fire and
          # main CI would never exercise the released pins).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/Jepson2k/par6.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "par6 @ git+https://github.com/Jepson2k/par6.git@${BRANCH}#subdirectory=python"
            fi
          fi

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Run tests
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: |
          pytest -vv --tb=long --log-cli-level=DEBUG

  # End-to-end against the Rust runtime: the whole WC stack (backend
  # discovery, Robot.start() spawn path, async client, status pipeline, UI)
  # driving a real `par6d --sim` over real UDP. Own job because the test
  # needs its own pytest process (backend choice is process-global) and
  # because building par6d needs the Rust toolchain plus par6's pinocchio
  # FFI shim. Kept off the OS/Python matrix: Linux x86_64 / 3.12 only.
  par6-e2e:
    name: par6 e2e (WC <-> par6d --sim)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same branch-matching convention as the pip installs above, resolved
      # once so the python client and the binary come from one tree. Falls
      # back to main — also the ref the [par6] extra pins — so main pushes
      # exercise the same thing pyproject declares.
      - name: Resolve par6 ref (branch-matching)
        id: par6-ref
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          REF=main
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/par6.git "$BRANCH" 2>/dev/null | grep -q .; then
              REF="$BRANCH"
            fi
          fi
          echo "resolved par6 ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout par6
        uses: actions/checkout@v4
        with:
          repository: Jepson2k/par6
          ref: ${{ steps.par6-ref.outputs.ref }}
          path: par6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: par6
          key: par6-e2e

      # Same paths/key as par6's own ci.yml (its ffi and e2e jobs), prefixed
      # with the checkout dir. env.sh is deliberately not cached: setup.sh
      # rewrites it every run with this workspace's absolute paths.
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: |
            par6/.ffi/bin
            par6/.ffi/env
            par6/.ffi/shim
          key: ffi-toolchain-${{ runner.os }}-${{ hashFiles('par6/scripts/ffi/setup.sh', 'par6/cpp/**') }}

      - name: build shim (scripts/ffi/setup.sh)
        working-directory: par6
        run: scripts/ffi/setup.sh

      # Release, not debug: the sim runs in wall-clock time and an
      # unoptimized RT loop misses its deadlines. `--features ffi` because
      # that is what deploys — a par6d without kinematics refuses to boot.
      - name: build par6d
        working-directory: par6
        run: |
          source .ffi/env.sh
          cargo build -p par6d --release --features ffi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          pip install ".[dev,par6]"
          # waldoctl/parol6 branch-matching, same as the jobs above.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
            fi
          fi
          # The par6 client must be the same tree the binary was built from,
          # and that tree is already checked out at the branch-matched ref.
          pip install --force-reinstall --no-deps ./par6/python

      # WALDO_PAR6_E2E=1 makes a missing backend or binary a FAILURE inside
      # the test, not a skip — this job must never go green without the e2e
      # actually running. env.sh is sourced (not hand-copied) because par6d
      # embeds no rpath: the spawned runtime inherits LD_LIBRARY_PATH for
      # the shim and its conda-env dependencies.
      - name: Run the par6 e2e test
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
          WALDO_PAR6_E2E: '1'
          PAR6D_BIN: ${{ github.workspace }}/par6/target/release/par6d
        run: |
          source par6/.ffi/env.sh
          pytest -vv --tb=long --log-cli-level=DEBUG tests/test_par6_backend.py
