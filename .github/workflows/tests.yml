name: tests

on:
  # Run once per change: pull_request covers PR branches; push covers main
  # (and any direct, PR-less pushes to it). Avoids the duplicate push +
  # pull_request runs on every PR commit. workflow_dispatch lets a branch
  # be exercised before any PR exists.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Constrains PEP 517 build environments too (see the file for why).
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/pip-build-constraints.txt

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          # waldoctl branch-matching must happen BEFORE ".[dev]": the pinned
          # tag may not exist yet while the release chain is in flight (this
          # package re-pins waldoctl before waldoctl merges and tags), and a
          # dead pin fails the whole resolve. Skipped on main: pushes to main
          # must test the pyproject-pinned tags.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          WALDOCTL_REF=""
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              WALDOCTL_REF="$BRANCH"
              pip install "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
              # Rewrite the pin for THIS resolve only, so ".[dev]" does not
              # re-fetch a tag that may not exist yet.
              # parol6 leaves this resolve too: its own metadata pins the
              # waldoctl tag, and pip cannot hold that next to the branch
              # URL. It is installed --no-deps right after ".[dev]".
              sed -i.bak -e "s#waldoctl.git@v[0-9.]*#waldoctl.git@${BRANCH}#" \
                -e "/parol6 @ git+/d" pyproject.toml
            fi
          fi
          pip install -e ".[dev]"
          if [ -n "$WALDOCTL_REF" ]; then
            mv pyproject.toml.bak pyproject.toml
          fi
          # parol6 installs --no-deps so branch-matching stays robust: a
          # branch-matched parol6 may pin a different waldoctl direct URL
          # than this package does, and pip cannot reconcile two direct
          # URLs in one resolve. Its remaining deps are named explicitly
          # (waldoctl/numpy/pinokin/pyserial/scipy/ruckig are above).
          # Derived from pyproject, never repeated: this install is
          # --no-deps and runs after ".[dev]", so a stale literal here
          # would silently downgrade parol6 in every job without a
          # branch match.
          PAROL6_REF="$(sed -n 's#.*PAROL6-python-API\.git@\([^"]*\)".*#\1#p' pyproject.toml | head -1)"
          : "${PAROL6_REF:?no parol6 pin found in pyproject.toml}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              PAROL6_REF="$BRANCH"
            fi
          fi
          pip install --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${PAROL6_REF}"
          pip install interpolatepy msgspec numba ormsgpack psutil toppra
          # par6 is NOT branch-matched here: its python package embeds the
          # compiled Rust engine (maturin + the pinocchio FFI shim), which
          # this matrix cannot build. The dedicated par6-e2e job builds the
          # shim and installs the branch-matched tree properly.
          mkdir -p PAROL6-python-API
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          # waldoctl branch-matching must happen BEFORE ".[dev]": the pinned
          # tag may not exist yet while the release chain is in flight (this
          # package re-pins waldoctl before waldoctl merges and tags), and a
          # dead pin fails the whole resolve. Skipped on main: pushes to main
          # must test the pyproject-pinned tags.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          WALDOCTL_REF=""
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              WALDOCTL_REF="$BRANCH"
              pip install "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
              # Rewrite the pin for THIS resolve only, so ".[dev]" does not
              # re-fetch a tag that may not exist yet.
              # parol6 leaves this resolve too: its own metadata pins the
              # waldoctl tag, and pip cannot hold that next to the branch
              # URL. It is installed --no-deps right after ".[dev]".
              sed -i.bak -e "s#waldoctl.git@v[0-9.]*#waldoctl.git@${BRANCH}#" \
                -e "/parol6 @ git+/d" pyproject.toml
            fi
          fi
          pip install ".[dev]"
          if [ -n "$WALDOCTL_REF" ]; then
            mv pyproject.toml.bak pyproject.toml
          fi
          # parol6 installs --no-deps so branch-matching stays robust: a
          # branch-matched parol6 may pin a different waldoctl direct URL
          # than this package does, and pip cannot reconcile two direct
          # URLs in one resolve. Its remaining deps are named explicitly
          # (waldoctl/numpy/pinokin/pyserial/scipy/ruckig are above).
          # Derived from pyproject, never repeated: this install is
          # --no-deps and runs after ".[dev]", so a stale literal here
          # would silently downgrade parol6 in every job without a
          # branch match.
          PAROL6_REF="$(sed -n 's#.*PAROL6-python-API\.git@\([^"]*\)".*#\1#p' pyproject.toml | head -1)"
          : "${PAROL6_REF:?no parol6 pin found in pyproject.toml}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              PAROL6_REF="$BRANCH"
            fi
          fi
          pip install --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${PAROL6_REF}"
          pip install interpolatepy msgspec numba ormsgpack psutil toppra
          # par6 is NOT branch-matched here: its python package embeds the
          # compiled Rust engine (maturin + the pinocchio FFI shim), which
          # this matrix cannot build. The dedicated par6-e2e job builds the
          # shim and installs the branch-matched tree properly.

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Run tests
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: |
          pytest -vv --tb=long --log-cli-level=DEBUG

  # End-to-end against the Rust runtime: the whole WC stack (backend
  # discovery, Robot.start() spawn path, async client, status pipeline, UI)
  # driving a real `par6d --sim` over real UDP. Own job because the test
  # needs its own pytest process (backend choice is process-global) and
  # because building par6d needs the Rust toolchain plus par6's pinocchio
  # FFI shim. Kept off the OS/Python matrix: Linux x86_64 / 3.12 only.
  par6-e2e:
    name: par6 e2e (WC <-> par6d --sim)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same branch-matching convention as the pip installs above, resolved
      # once so the python client and the binary come from one tree. Falls
      # back to main — also the ref the [par6] extra pins — so main pushes
      # exercise the same thing pyproject declares.
      - name: Resolve par6 ref (branch-matching)
        id: par6-ref
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          REF=main
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/par6.git "$BRANCH" 2>/dev/null | grep -q .; then
              REF="$BRANCH"
            fi
          fi
          echo "resolved par6 ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout par6
        uses: actions/checkout@v4
        with:
          repository: Jepson2k/par6
          ref: ${{ steps.par6-ref.outputs.ref }}
          path: par6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: par6
          key: par6-e2e

      # par6 provisions its native dependencies one of two ways depending on
      # the ref this resolved to, and the branch being tested may be either:
      # `scripts/ffi/setup.sh` writing `.ffi/env.sh`, or pixi, which supplies
      # the same closure through environment activation and additionally sets
      # `MUJOCO_DOWNLOAD_DIR` for `mujoco-rs`. Building a pixi tree the old
      # way fails in `mujoco-rs`'s build script with nowhere to download to.
      - name: Detect par6 provisioning
        id: par6-build
        run: |
          PIXI=false
          [ -f par6/pixi.toml ] && PIXI=true
          echo "resolved par6 provisioning: pixi=$PIXI"
          echo "pixi=$PIXI" >> "$GITHUB_OUTPUT"

      - uses: prefix-dev/setup-pixi@v0.8.1
        if: steps.par6-build.outputs.pixi == 'true'
        with:
          pixi-version: v0.79.0
          manifest-path: par6/pixi.toml
          cache: true
          environments: default

      # Same path and key shape as par6's own ci.yml, prefixed with the
      # checkout dir. Keyed on the provisioning too, since the two fill
      # `.ffi` with different trees.
      - name: cache pinocchio toolchain
        uses: actions/cache@v4
        with:
          path: par6/.ffi
          key: >-
            ffi-${{ runner.os }}-${{ steps.par6-build.outputs.pixi }}-${{
            hashFiles('par6/pixi.lock', 'par6/scripts/ffi/**', 'par6/cpp/**') }}

      # Release, not debug: the sim runs in wall-clock time and an
      # unoptimized RT loop misses its deadlines. Kinematics is not a
      # feature — par6d links the FFI shim unconditionally.
      #
      # Whichever provisioning ran then publishes its variables to the job,
      # because two later steps need them from outside this shell: the par6
      # wheel is a maturin build (it links the shim and downloads libmujoco),
      # and it is built into WC's own Python environment, not the provisioner's
      # — so `pixi run pip` would install into the wrong interpreter. par6d
      # embeds no rpath either, so the spawned runtime needs the library path.
      # The names follow par6's `[activation.env]` and its `.ffi/env.sh`;
      # whichever of them is set gets forwarded.
      - name: build the shim and par6d
        working-directory: par6
        env:
          PAR6_FORWARD: >-
            PAR6_SHIM_LIB_DIR PAR6_SHIM_INCLUDE_DIR PAR6_MUJOCO_LIB_DIR
            MUJOCO_DOWNLOAD_DIR LD_LIBRARY_PATH
        run: |
          FWD='for v in $PAR6_FORWARD; do [ -n "${!v:-}" ] && printf "%s=%s\n" "$v" "${!v}"; done; true'
          if [ "${{ steps.par6-build.outputs.pixi }}" = "true" ]; then
            pixi run setup
            pixi run cargo build -p par6d --release
            pixi run bash -c "$FWD" >> "$GITHUB_ENV"
          else
            scripts/ffi/setup.sh
            source .ffi/env.sh
            cargo build -p par6d --release
            bash -c "$FWD" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          # waldoctl branch-matching BEFORE ".[dev]" — same rationale as the
          # jobs above (the pinned tag may not exist mid-release-chain).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          WALDOCTL_REF=""
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              WALDOCTL_REF="$BRANCH"
              pip install "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
              # parol6 leaves this resolve too: its own metadata pins the
              # waldoctl tag, and pip cannot hold that next to the branch
              # URL. It is installed --no-deps right after ".[dev]".
              sed -i.bak -e "s#waldoctl.git@v[0-9.]*#waldoctl.git@${BRANCH}#" \
                -e "/parol6 @ git+/d" pyproject.toml
            fi
          fi
          pip install ".[dev]"
          if [ -n "$WALDOCTL_REF" ]; then
            mv pyproject.toml.bak pyproject.toml
          fi
          # parol6 rides along --no-deps (direct-URL branch-drift hazard,
          # same as the jobs above); this job's backend under test is par6.
          # Derived from pyproject, never repeated: this install is
          # --no-deps and runs after ".[dev]", so a stale literal here
          # would silently downgrade parol6 in every job without a
          # branch match.
          PAROL6_REF="$(sed -n 's#.*PAROL6-python-API\.git@\([^"]*\)".*#\1#p' pyproject.toml | head -1)"
          : "${PAROL6_REF:?no parol6 pin found in pyproject.toml}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              PAROL6_REF="$BRANCH"
            fi
          fi
          pip install --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${PAROL6_REF}"
          pip install interpolatepy msgspec numba ormsgpack psutil toppra
          # The par6 client must be the same tree the binary was built from,
          # and that tree is already checked out at the branch-matched ref.
          # It is a maturin package embedding the Rust engine, so the shim
          # env must be live for the build (and no build isolation, so the
          # toolchain above is the one that compiles it).
          pip install "maturin>=1.7,<2" patchelf
          pip install --force-reinstall --no-deps --no-build-isolation ./par6/python

      # WALDO_PAR6_E2E=1 makes a missing backend or binary a FAILURE inside
      # the test, not a skip — this job must never go green without the e2e
      # actually running. The spawned runtime inherits the library path
      # exported by the provisioning step above.
      - name: Run the par6 e2e test
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
          WALDO_PAR6_E2E: '1'
          PAR6D_BIN: ${{ github.workspace }}/par6/target/release/par6d
        run: |
          pytest -vv --tb=long --log-cli-level=DEBUG tests/test_par6_backend.py
