name: tests

on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
            pip install "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
          fi
          if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
            pip install "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
          else
            pip install "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@v0.2.7"
          fi
          pip install -e ".[dev]"
          mkdir -p PAROL6-python-API
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install cross-repo dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # waldoctl: try matching branch, fall back to tagged version
          if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
            pip install "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
          fi
          # parol6: try matching branch, fall back to tagged version
          if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
            pip install "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
          else
            pip install "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@v0.2.7"
          fi

      - name: Install package
        run: |
          pip install ".[dev]"

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Run tests
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: |
          pytest -vv --tb=long --log-cli-level=DEBUG
