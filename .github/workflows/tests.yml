name: tests

on:
  # Run once per change: pull_request covers PR branches; push covers main
  # (and any direct, PR-less pushes to it). Avoids the duplicate push +
  # pull_request runs on every PR commit.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for pre-commit hooks
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          pip install -e ".[dev]"
          # Override the pinned waldoctl/parol6 with the matching feature branch
          # if one exists, AFTER ".[dev]" so its pinned tags don't clobber it.
          # Skipped on main: pushes to main must test the pyproject-pinned tags
          # (every sibling repo has a `main`, so the match would always fire and
          # main CI would never exercise the released pins).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
            fi
          fi
          mkdir -p PAROL6-python-API
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # ruckig 0.17.3 sdist doesn't build under scikit-build-core 1.0;
          # pre-install the fixed commit until a release lands (pantor/ruckig#262).
          pip install "ruckig @ git+https://github.com/pantor/ruckig@2249d57ffaa19ecdadeaab62daf97857813629ff"
          pip install ".[dev]"
          # Override the pinned waldoctl/parol6 with the matching feature branch
          # if one exists, AFTER ".[dev]" so its pinned tags don't clobber it.
          # Skipped on main: pushes to main must test the pyproject-pinned tags
          # (every sibling repo has a `main`, so the match would always fire and
          # main CI would never exercise the released pins).
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [ "$BRANCH" != "main" ]; then
            if git ls-remote --heads https://github.com/Jepson2k/waldoctl.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "waldoctl @ git+https://github.com/Jepson2k/waldoctl.git@${BRANCH}"
            fi
            if git ls-remote --heads https://github.com/PCrnjak/PAROL6-python-API.git "$BRANCH" 2>/dev/null | grep -q .; then
              pip install --force-reinstall --no-deps "parol6 @ git+https://github.com/PCrnjak/PAROL6-python-API.git@${BRANCH}"
            fi
          fi

      - name: Show environment
        run: |
          python -V
          pip list

      - name: Run tests
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONUTF8: '1'
        run: |
          pytest -vv --tb=long --log-cli-level=DEBUG
